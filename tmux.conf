# ============================================================
# 基础设置
# ============================================================

# 使用默认前缀键 Ctrl+b
unbind -q C-a
set -g prefix C-b
bind C-b send-prefix

# 由 install.sh 安装；路径占位符会替换为当前用户的安装位置。
# tmux 内使用自己的 terminfo，外层 xterm-256color 启用真彩色。
set -g default-terminal "tmux-256color"
# 固定数组下标，反复重载不会重复追加；sync 由终端 profile 决定。
set -s terminal-features[10] "xterm-256color:RGB"

# 减小 ESC 延迟 (vim 用户必备)
set -sg escape-time 10

# 增大历史缓冲区
set -g history-limit 50000

# 启用鼠标支持 (滚动、选择、调整窗格)
set -g mouse on

# 窗口和窗格编号从 1 开始 (键盘上更顺手)
set -g base-index 1
setw -g pane-base-index 1

# 关闭窗口后自动重新编号
set -g renumber-windows on

# 焦点事件 (vim 自动重载等)
set -g focus-events on

# 提升消息显示时间
set -g display-time 2000
set -g display-panes-time 2000

# ============================================================
# 快捷键
# ============================================================

# 重载配置文件
bind r source-file @MAIN_CONFIG@ \; display-message "配置已重载"

# 更直观的窗格分割 (保留默认 % 和 ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新窗口在当前路径打开
bind c new-window -c "#{pane_current_path}"

# Vim 风格窗格切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim 风格调整窗格大小 (可重复)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+方向键快速切换窗口 (无需前缀)
bind -n M-Left  previous-window
bind -n M-Right next-window

# 交换窗格 (Shift+方向键,可重复按)
bind -r < swap-pane -U
bind -r > swap-pane -D

# 复制模式使用 vi 键位
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================================
# Catppuccin Latte 状态栏（无插件；CPU / MEM 使用一个轻量采样脚本）
# ============================================================

# CPU / MEM 每 15 秒更新；不影响应用动画。
set -g status-interval 15
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#e6e9ef,fg=#4c4f69"

set -g status-left-length 40
set -g status-left "#[fg=#eff1f5,bg=#8839ef,bold] #S #[default] "

set -g status-right-length 30
set -g status-right @STATUS_RIGHT@

setw -g window-status-format "#[fg=#5c5f77,bg=#e6e9ef,nobold] #I:#W#{?window_bell_flag, !,} "
setw -g window-status-current-format "#[fg=#4c4f69,bg=#ccd0da,bold] #I:#W#{?window_bell_flag, !,} "

# 窗格边框
set -g pane-border-style "fg=#9ca0b0"
set -g pane-active-border-style "fg=#8839ef"

set -g window-status-separator "  "
set -g message-style "bg=#dce0e8,fg=#4c4f69"
set -g message-command-style "bg=#dce0e8,fg=#4c4f69"
set -g mode-style "bg=#ccd0da,fg=#4c4f69"

# Forward terminal bells, including from background windows (Codex completion).
set -g bell-action any
set -g visual-bell off

# 终端能力选项和本机覆盖配置；本机覆盖文件不会被安装脚本改写。
source-file -q @TERMINAL_CONFIG@
source-file -q @LOCAL_CONFIG@
